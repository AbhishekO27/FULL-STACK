<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .btn{
        
    }
</style>
<body>
    <div class="calculator">

        <input type="text" id="display" readonly>
        <br>

        <button class="btn" onclick="press('1')">1</button>
        <button class="btn" onclick="press('2')">2</button>
        <button class="btn" onclick="press('3')">3</button>
        <br>
        <button class="btn" onclick="press('4')">4</button>
        <button class="btn" onclick="press('5')">5</button>
        <button class="btn" onclick="press('6')">6</button>
        <br>
        <button class="btn" onclick="press('7')">7</button>
        <button class="btn" onclick="press('8')">8</button>
        <button class="btn" onclick="press('9')">9</button>
        <br>
        <button class="btn" onclick="press('0')">0</button>
        <br>
        <button class="btn opt" onclick="press('+')">+</button>
        <button class="btn opt" onclick="press('-')">-</button>
        <button class="btn opt" onclick="press('/')">/</button>
        <br>
        <button class="btn opt" onclick="press('*')">*</button>
        <button class="btn opt" onclick="press('^')">^</button>
        <button class="btn opt" onclick="calculate('=')">=</button>
        <br>
        <button class="btn clear" onclick="clear_display()">clear</button>

    </div>
</body>

<script>
    let calculator={
        addtoDisplay: function(value){
            document.getElementById("display").value+=value;
        },
        clear: function(){
            document.getElementById("display").value=" ";
        },
        calculateR: function()
        {
           let val=document.getElementById("display").value;
           document.getElementById("display").value=eval(val);
        }

    };
    function press(val){
        calculator.addtoDisplay(val);
    }
    function calculate(){
        calculator.calculateR();
    }
    function clear_display()
    {
        calculator.clear();
    }
</script>
</html>
