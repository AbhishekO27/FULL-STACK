<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>

    <style>
        #logo-text {
            color: red;
            font-size: 50px;
        }

        form {
            background-color: rgb(240, 247, 245);
            border: 1px solid;
            border-radius: 20px;
            text-align: center;
            margin: 30px 200px 30px 200px;
            transition: box-shadow 0.25s;
        }

        form:hover {
            box-shadow: 2px 2px 30px rgba(0, 0, 0, 0.1);
        }

        input,
        select {
            margin-bottom: 30px;
            border-radius: 15px;
            padding: 5px;
        }

        button {
            font-size: 15px;
            font-weight: bold;
            margin: 30px;
            border: 2px solid;
            cursor: pointer;
            background: rgb(240, 247, 245);
            border-radius: 10px;
            padding: 8px 20px;
        }

        button:hover {
            background-color: rgb(143, 211, 243);
        }

        label {
            font-weight: bold;
            font-size: 17px;
        }

        h1 {
            background: rgb(240, 247, 245);
        }
    </style>
</head>

<body>

    <form action="thankyou.html">

        <img src="logo.png" style="height: 200px;">

        <marquee id="logo-text" direction="left">
            Graphic Era Deemed University
        </marquee>

        <h1>Student Registration Form</h1>

        <label>Student Name :</label>
        <input type="text" placeholder="John Doe" required>
        <br>

        <label>University Email ID :</label>
        <input type="email" placeholder="johndoe@geu.ac.in" required>
        <br>

        <label>USN/Roll Number :</label>
        <input type="text" placeholder="2023XXX" required>
        <br>

        <label>Course :</label>

        <select name="course" required>
            <option disabled selected>---Select---</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>BCA</option>
        </select>

        <br>

        <label>Age :</label>
        <input type="number" min="18" max="30" placeholder="XX" required>

        <br>

        <label>Gender :</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br>

        <label for="resume">Resume</label>
        <br>

        <input type="file" id="resume">

        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
